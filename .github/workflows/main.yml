name: Setup ngrok and Remote Desktop

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  setup-ngrok:
    runs-on: windows-latest
    timeout-minutes: 360  # Max allowed: 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download ngrok (with retry)
        run: |
          $retry = 3
          while ($retry -gt 0) {
            try {
              Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip -UseBasicParsing
              if (Test-Path ngrok.zip) { break }
            } catch {
              Write-Host "Retrying download... ($retry left)"
            }
            Start-Sleep -Seconds 5
            $retry--
          }
          if (!(Test-Path ngrok.zip)) { throw "❌ Failed to download ngrok after retries." }
          
      - name: Extract ngrok
        run: |
          Expand-Archive ngrok.zip -DestinationPath .
          if (!(Test-Path .\ngrok.exe)) { throw "❌ Failed to extract ngrok." }
          
      - name: Update ngrok
        run: .\ngrok.exe update

      - name: Authenticate ngrok
        run: .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Setup File Download, Extract, Macro Recorder & Registration
        shell: pwsh
        run: |
          # 1. Google Drive سے فائل ڈیسک ٹاپ پر ڈاؤن لوڈ کریں
          Write-Host "Installing gdown..."
          pip install gdown -q
          Set-Location -Path "C:\Users\Public\Desktop"
          Write-Host "Downloading file from Google Drive..."
          gdown "https://drive.google.com/uc?id=1WgcAipfuH2bgC1tnsB7VtOTdf9qTq-1H"
          
          # 2. ڈیسک ٹاپ پر مکمل ایکسٹریکٹ (Full Extract Here)
          $archives = Get-ChildItem -Path "C:\Users\Public\Desktop" | Where-Object { $_.Extension -match "\.(zip|rar)$" }
          foreach ($archive in $archives) {
              Write-Host "Extracting $($archive.Name)..."
              7z x "$($archive.FullName)" -o"C:\Users\Public\Desktop" -y
              Write-Host "✅ Fully extracted!"
          }

          # 3. Macro Recorder کی رجسٹری کیز (multiple patterns)
          Write-Host "Applying License Registration Keys..."
          $regPaths = @("HKCU:\Software\Jitbit\Macro Recorder", "HKLM:\Software\Jitbit\Macro Recorder")
          foreach ($path in $regPaths) {
              if (!(Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              New-ItemProperty -Path $path -Name "Username" -Value "1" -PropertyType String -Force | Out-Null
              New-ItemProperty -Path $path -Name "UserName" -Value "1" -PropertyType String -Force | Out-Null
              New-ItemProperty -Path $path -Name "Serial" -Value "YSwY2A5RxI5BJKKnIsA6+jlR86MBGNCmwD+/kXt/xALDbvFTs7jVKwSw" -PropertyType String -Force | Out-Null
              New-ItemProperty -Path $path -Name "LicenseKey" -Value "YSwY2A5RxI5BJKKnIsA6+jlR86MBGNCmwD+/kXt/xALDbvFTs7jVKwSw" -PropertyType String -Force | Out-Null
          }

          # 4. Macro Recorder Setup.exe کی آٹو انسٹالیشن
          $macroSetup = Get-ChildItem -Path "C:\Users\Public\Desktop" -Filter "*Macro*Recorder*.exe" -Recurse | Select-Object -First 1
          if ($macroSetup) {
              Write-Host "Auto-installing $($macroSetup.Name)..."
              Start-Process -FilePath $macroSetup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/S", "/quiet" -Wait -NoNewWindow
              Write-Host "✅ Macro Recorder installed!"
          }

          # 5. آٹو رجسٹریشن بذریعہ SendKeys (اگر بائی پاس رجسٹری کام نہ کرے)
          Start-Sleep -Seconds 3
          $exePath = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Macro Recorder", "${env:ProgramFiles}\Macro Recorder" -Filter "MacroRecorder.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exePath) {
              Write-Host "Launching Macro Recorder to auto-submit license..."
              $proc = Start-Process -FilePath $exePath.FullName -PassThru
              Start-Sleep -Seconds 4
              
              $wshell = New-Object -ComObject WScript.Shell
              if ($wshell.AppActivate("Macro Recorder") -or $wshell.AppActivate("Register")) {
                  # یوزر نیم بھیجیں
                  $wshell.SendKeys("1")
                  Start-Sleep -Milliseconds 500
                  $wshell.SendKeys("{TAB}")
                  Start-Sleep -Milliseconds 500
                  # سیریل کی بھیجیں
                  $wshell.SendKeys("YSwY2A5RxI5BJKKnIsA6+jlR86MBGNCmwD+/kXt/xALDbvFTs7jVKwSw")
                  Start-Sleep -Milliseconds 500
                  $wshell.SendKeys("{ENTER}")
                  Write-Host "✅ Auto-keys sent successfully!"
              }
          }

          # 6. Google Chrome Extensions Policy
          $chromePolicyPath = "HKLM:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"
          if (!(Test-Path $chromePolicyPath)) { New-Item -Path $chromePolicyPath -Force | Out-Null }
          New-ItemProperty -Path $chromePolicyPath -Name "1" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $chromePolicyPath -Name "2" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          Write-Host "✅ Chrome Extensions Force-installed!"

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          
      - name: Set Password for runneradmin
        run: |
          $user = Get-LocalUser -Name "runneradmin"
          if ($user.Enabled -eq $false) { Enable-LocalUser -Name "runneradmin" }
          $secPass = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $secPass
          
      - name: Start ngrok TCP tunnel (RDP port)
        run: |
          Start-Process -FilePath .\ngrok.exe -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          Get-Content ngrok.log -ErrorAction SilentlyContinue
          
      - name: Display connection info
        run: |
          $apiUrl = "http://127.0.0.1:4040/api/tunnels"
          try {
            $response = Invoke-RestMethod -Uri $apiUrl
            $tcpAddr = ($response.tunnels | Where-Object { $_.proto -eq "tcp" }).public_url
            if ($tcpAddr) {
              $cleanAddr = $tcpAddr -replace "tcp://", ""
              Write-Output $cleanAddr
              Write-Output "runneradmin"
              Write-Output "P@ssw0rd!"
            } else {
              Write-Output "⚠️ Unable to fetch tunnel info yet."
            }
          } catch {
            Write-Output "⚠️ Ngrok API not responding."
          }
          
      - name: Keep Alive (6 hours)
        run: |
          for ($i = 0; $i -lt 72; $i++) {
            Write-Host "⏳ Still alive... Hour: $($i * 5) minutes"
            Start-Sleep -Seconds 300
          }
        continue-on-error: true
